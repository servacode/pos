# Secret scanning (CI): gitleaks' default rules, minus made-up values used only as test fixtures.
# Add a value here only if it has never been, and never will be, a real secret.
[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures that look like secrets"
regexTarget = "match"
regexes = [
  '''test-secret-that-is-definitely-long-enough-123''',
  '''Zr4x9Qw2Lp8Vt6Nb3Hc7Jd1Kf5Gm0Sa''',
  '''Kq8vX2mPz7Lw4Rt9''',
  # apps/api/test/error-reporting.test.ts: {"alg":"HS256"}.{"sub":"user"}."signature", planted to prove it is scrubbed
  '''eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyIn0.c2lnbmF0dXJl''',
  # apps/api/test/totp.test.ts: the JWT secret the two-factor encryption test derives its key from
  '''a-long-enough-jwt-secret-for-the-test-1234567890''',
]
