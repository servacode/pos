# Serva local server (tab 00 › «الخادم المحلي أولاً»): the whole system on one computer in the office,
# reachable by every device on the same Wi-Fi at https://<this computer's LAN address>.
#
# Do not run `docker compose` on this file by hand; use the scripts, which create the secrets in
# deploy/local/.env on first run and pass this computer's LAN addresses to the certificate:
#   pnpm local:up | local:down | local:deploy | local:backup | local:restore <file>
# Guide: docs/local-server.md
#
# Data lives in the named volume `serva-local_pgdata`. `docker compose down -v` deletes it: never.

name: serva-local

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# App containers: read-only file system, no Linux capabilities, no privilege escalation
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging: *logging

services:
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing; run pnpm local:up to create deploy/local/.env}
      # Used once, when the volume is empty, by pg/init-roles.sh
      SERVA_OWNER_PASSWORD: ${SERVA_OWNER_PASSWORD:?missing; run pnpm local:up}
      SERVA_APP_PASSWORD: ${SERVA_APP_PASSWORD:?missing; run pnpm local:up}
      # Page checksums: a damaged disk is reported instead of silently returning bad data
      POSTGRES_INITDB_ARGS: --data-checksums
    command: ['postgres', '-c', 'log_statement=none']
    # Only this computer can reach the database (Docker bypasses host firewalls such as ufw, so a
    # bare '5433:5432' would open it to the whole network).
    ports:
      - '127.0.0.1:${SERVA_PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg:/serva/pg:ro
      - ../../scripts/db-bootstrap.sql:/serva/bootstrap.sql:ro
      - ./pg/init-roles.sh:/docker-entrypoint-initdb.d/10-serva-roles.sh:ro
    healthcheck:
      # Over TCP: during first-time setup the server listens on the socket only, so this stays
      # unhealthy until the roles and databases exist.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d serva']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt: ['no-new-privileges:true']
    logging: *logging
    networks: [serva]

  # One-shot: the local CA (once) and the HTTPS certificate for this computer's addresses
  # (again whenever they change, or 30 days before it expires).
  certs:
    image: postgres:16.15-bookworm
    entrypoint: ['bash', '/serva/make-certs.sh']
    environment:
      SERVA_LAN_IPS: ${SERVA_LAN_IPS:-}
      SERVA_EXTRA_HOSTS: ${SERVA_EXTRA_HOSTS:-}
    volumes:
      - ./certs/make-certs.sh:/serva/make-certs.sh:ro
      - ca:/ca
      - certs:/certs
    network_mode: none
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # One-shot: database migrations, then the reference data (plans, first platform admin).
  migrate:
    image: serva-api:local
    pull_policy: never
    command: ['sh', '-c', 'node dist/scripts/migrate.js && node dist/scripts/seed.js']
    environment:
      DATABASE_MIGRATION_URL: postgres://serva_owner:${SERVA_OWNER_PASSWORD}@postgres:5432/serva
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    <<: *hardened
    tmpfs: [/tmp]
    networks: [serva]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: serva-api:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgres://serva_app:${SERVA_APP_PASSWORD}@postgres:5432/serva
      JWT_SECRET: ${JWT_SECRET:?missing; run pnpm local:up}
      # Only the web container may report the client address (X-Forwarded-For)
      TRUST_PROXY: ${SERVA_PROXY_IP:-172.30.77.10}
      # Test mode (no SMS here): sign-up codes are shown on screen. SERVA_OTP_DELIVERY=none in
      # deploy/local/.env turns it off. The API refuses "screen" without DEPLOYMENT=local.
      DEPLOYMENT: local
      OTP_DELIVERY: ${SERVA_OTP_DELIVERY:-screen}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    <<: *hardened
    tmpfs: [/tmp]
    networks: [serva]

  # The app and the reverse proxy: one address for the app (/) and the API (/v1, /health).
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: serva-web:local
    restart: unless-stopped
    environment:
      SERVA_API_UPSTREAM: api:3000
      SERVA_HTTPS_PORT: ${SERVA_HTTPS_PORT:-443}
    # On every network interface: cashier devices on the shop's Wi-Fi connect here.
    ports:
      - '${SERVA_BIND_ADDRESS:-0.0.0.0}:${SERVA_HTTP_PORT:-80}:8080'
      - '${SERVA_BIND_ADDRESS:-0.0.0.0}:${SERVA_HTTPS_PORT:-443}:8443'
    volumes:
      - certs:/etc/nginx/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    <<: *hardened
    # nginx (uid 101) writes its generated config, pid file and temp files here
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    networks:
      serva:
        ipv4_address: ${SERVA_PROXY_IP:-172.30.77.10}

networks:
  serva:
    ipam:
      config:
        # Change both SERVA_SUBNET and SERVA_PROXY_IP in .env if this range is taken on your network
        - subnet: ${SERVA_SUBNET:-172.30.77.0/24}

volumes:
  pgdata:
  ca:
  certs:
