# Headers on everything the web app serves (the API sets its own; see apps/api/src/http/security-headers.ts).
# Included in each location, because a location's own add_header drops the inherited ones.
#
# CSP (tab 16 › XSS): scripts and styles only from this origin or carrying this request's nonce.
# $request_id is 128 random bits, new for every request; default.conf.template stamps it on every
# <script> and <style> tag of index.html. No inline code, no eval, no other origin, never framed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Camera (barcode scanning), USB and serial (printers, cash drawer, tab 21) stay available to this
# origin only; the rest is off.
add_header Permissions-Policy "camera=(self), usb=(self), serial=(self), microphone=(), geolocation=(), payment=()" always;
